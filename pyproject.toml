[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "game-retention-abtest"
version = "1.0.0"
description = "Statistical analysis of the Cookie Cats progression-gate A/B test"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kaveen Seneviratne" }]
license = { text = "MIT" }
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "scipy>=1.11",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pandas-stubs>=2.1",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[project.scripts]
abtest = "abtest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear: likely bugs
    "UP",       # modern syntax
    "N",        # naming
    "SIM",      # simplifications
    "RUF",      # ruff-specific
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
# scipy and statsmodels ship without type hints
[[tool.mypy.overrides]]
module = ["scipy.*", "statsmodels.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::FutureWarning"]

[tool.coverage.run]
source = ["abtest"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
